name: Update Blox Fruits Codes

on:
  schedule:
   - cron: "3-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_codes.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-blox-fruits-codes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32.4,<3" "beautifulsoup4>=4.13.4,<5"
      - name: Update code list
        run: python update_codes.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update Blox Fruits codes"
          git push origin HEAD:main
